<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>셀렉터 만들기</title>
<style>
    /* 전체 배경색 적용 */
    body.main {
        background-color: lightblue; 
    }
    
    /* p 태그 중 help 클래스를 가진 요소만 빨간색 적용 (도움말 div는 제외) */
    p.help {
        color: red;
    }
    
    /* hot 아이디를 가진 요소 글자색 및 배경(또는 밑줄) 색상 적용 */
    #hot {
        color: red;
        /* 교재 의도에 따라 배경색이나 밑줄로 표현될 수 있습니다 */
        text-decoration: underline;
        text-decoration-color: orange; 
        /* background-color: orange; 로 대체 가능 */
    }
</style>
</head>
<body class="main">
<h3 class="headline">클래스 셀렉터</h3>
<hr>
<div class="help">도움말</div>
<p class="help">!!경고 메시지</p>
<p id="hot">뜨거운 태양</p>
</body>
</html>
