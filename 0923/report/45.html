<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>셀렉터</title>
<style>
    /* 전체 배경색 적용 */
    body.main {
        background-color: powderblue; /* lightblue 등 유사한 색상 사용 가능 */
    }
    
    /* center 아이디를 가진 요소 가운데 정렬 */
    #center {
        text-align: center;
    }
    
    /* strong 태그 요소(박인희, 꽃)의 글자색을 빨간색으로 변경 */
    strong {
        color: red;
    }
    
    /* indent 클래스를 가진 요소의 왼쪽 여백(들여쓰기) 적용 */
    .indent {
        padding-left: 2em; /* 또는 margin-left: 30px; 등 */
    }
</style>
</head>
<body class="main">
<h3>얼굴</h3>
<hr>
<div id="center"><strong>박인희</strong></div>
<div class="indent">
    <p><em>길</em>을 걷고 산들 무엇하리 
    <strong>꽃</strong>이 내가 아니듯 내가 
    <strong>꽃</strong>이 될 수 없는 지금...</p>
</div>
</body>
</html>
