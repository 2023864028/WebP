<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>링크 꾸미기</title>
<style>
    a {
        color: green; /* 밑줄이 없는 초록색 링크 */
        text-decoration: none; 
    }
    a:hover {
        color: violet; /* 마우스가 올라가면 violet 색으로 변경 */
        text-decoration: underline; /* 마우스가 올라가면 밑줄 표시 */
    }
</style>
</head>
<body>
<h3>링크 꾸미기</h3>
<hr>
<p>초록색에 밑줄없는 링크, 마우스를 올리면 밑줄과 violet 색으로 변경</p>
<ul>
    <li><a href="https://www.naver.com" target="_blank">네이버 사이트</a></li>
    <li><a href="https://www.google.com" target="_blank">구글 사이트</a></li>
</ul>
</body>
</html>
