<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>:hover 활용</title>
<style>
    .text-box {
        display: inline-block;
        vertical-align: top;
        margin-right: 20px;
        width: 120px;
    }
    
    .card {
        display: inline-block;
        width: 100px; /* 카드의 가로 크기 지정 */
        height: 140px; /* 카드의 세로 크기 지정 */
        background-image: url('back.png'); /* 카드 뒷면 이미지 설정 */
        background-size: cover;
    }
    
    /* 마우스가 올라갔을 때 카드 앞면 이미지로 변경 */
    .card:hover {
        background-image: url('front.png'); 
    }
</style>
</head>
<body>
<h3>:hover 활용</h3>
<hr>
<div class="text-box">
    마우스를 올리면<br>
    카드의 앞면이 보<br>
    인다.
</div>
<div class="card"></div>
</body>
</html>
