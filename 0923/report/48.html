<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이미지 테두리</title>
<style>
    img {
        /* 두께 15px의 액자 모양(ridge) 이미지 테두리 작성 */
        border: 15px ridge steelblue; 
        
        /* 테두리와 이미지 사이의 공간(패딩) 5px 지정 */
        padding: 5px; 
    }
</style>
</head>
<body>
<h3>이미지 테두리 만들기</h3>
<hr>
<img src="image.jpg" alt="풍경 이미지" width="300">
</body>
</html>
