<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>text-shadow와 box-shadow</title>
<style>
    /* 제목 텍스트 꾸미기 */
    h3 {
        text-align: center;
        font-style: italic; /* 이미지에서 약간 기울어진 글꼴로 보임 */
        color: darkolivegreen; 
        /* 텍스트 그림자: 가로거리 세로거리 번짐정도 색상 */
        text-shadow: 3px 3px 5px yellowgreen; 
    }
    
    /* 이미지 가운데 정렬 */
    img {
        display: block;
        margin: 0 auto; 
        transition: box-shadow 0.3s ease; /* 그림자가 자연스럽게 생기도록 애니메이션 추가 (선택사항) */
    }
    
    /* 이미지에 마우스를 올렸을 때(:hover) 박스 그림자 생성 */
    img:hover {
        /* 박스 그림자: 가로거리 세로거리 번짐정도 색상 */
        box-shadow: 5px 5px 15px gray; 
    }
</style>
</head>
<body>
    <h3>Most Visited Pages</h3>
    <!-- 이미지 경로는 실제 가지고 계신 이미지 파일명으로 수정하여 사용하세요 -->
    <img src="visited_pages.jpg" alt="방문 기록 이미지" width="500">
</body>
</html>
