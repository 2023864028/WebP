<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리스트 만들기</title>
    <style>
        ul {
            background-color: aliceblue; /* 기본 배경색 */
            width: 250px;
            padding: 10px 10px 10px 30px; /* 왼쪽 여백 및 기타 여백 설정 */
        }
        /* 리스트 아이템에 마우스를 올리면 색깔이 yellowgreen으로 변함 */
        li:hover {
            background-color: yellowgreen;
        }
    </style>
</head>
<body>
    <h3>가보고 싶은 나라</h3>
    <hr>
    <ul>
        <li>프랑스</li>
        <li>독일</li>
        <li>칠레</li>
        <li>남아프리카공화국</li>
    </ul>
</body>
</html>

            background-image: url('worldmap.png'); /* 세계지도 배경으로 출력[cite: 2] */
