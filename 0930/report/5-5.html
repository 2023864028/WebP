<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스폰지밥</title>
    <style>
        img {
            float: left;            /* 이미지를 왼쪽에 배치하여 텍스트가 감싸도록 함 */
            border: 1px solid gray; /* 테두리를 두름[cite: 2] */
            margin: 10px;           /* 여백은 10px[cite: 2] */
            padding: 5px;           /* 패딩은 5픽셀[cite: 2] */
        }
    </style>
</head>
<body>
    <h3>스폰지밥</h3>
    <hr>
    <div>
        <!-- 실제 환경에서는 src에 로컬 이미지 파일 경로를 입력하세요 -->
        <img src="spongebob.png" alt="스폰지밥">
        저는 스폰지밥입니다. 먹는 밥이 아니고요 제 이름이 그냥 그래요. 
        그리고 어린이부터 노인까지 많은 분들의 사랑을 받고 있어요. 
        제 친구 뚱이도 있고요, 징징이도 있고 집게 사장님도 있어요.
    </div>
</body>
</html>
