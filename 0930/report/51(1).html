<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3개의 div 활용</title>
    <style>
        .box {
            display: inline-block; /* 핵심: 가로 배치 및 크기 지정 가능 */
            width: 200px;          /* 박스의 폭 200픽셀 */
            border: 1px solid gray;
            background-color: #f4f4f4;
            padding: 5px;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <h3>3개의 div 활용</h3>
    <hr>
    <div class="box">캔버스에 이미지를 그리기 위해서는 이미지를 담을 객체가 먼저 필요하다.</div>
    <div class="box">Image 객체의 src 프로퍼티를 이용하여 비트맵을 로드한다.</div>
    <div class="box">이미지 로딩이 끝나면 그때 비로소 이미지의 너비와 높이가 제대로 알려진다.</div>
</body>
</html>
