<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3개의 div 활용</title>
    <style>
        .inline-box {
            display: inline; /* 핵심: 텍스트처럼 이어지게 배치 */
            border: 1px solid gray;
            background-color: #e0e0e0;
            line-height: 2;
        }
    </style>
</head>
<body>
    <h3>3개의 div 활용</h3>
    <hr>
    <div class="inline-box">캔버스에 이미지를 그리기 위해서는 이미지를 담을 객체가 먼저 필요하다.</div>
    <div class="inline-box">Image 객체의 src 프로퍼티를 이용하여 비트맵을 로드한다.</div>
    <div class="inline-box">이미지 로딩이 끝나면 그때 비로소 이미지의 너비와 높이가 제대로 알려진다.</div>
</body>
</html>
