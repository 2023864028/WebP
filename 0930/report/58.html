<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리스트로 수직 메뉴 만들기</title>
    <style>
        ul {
            list-style-type: none; /* 리스트의 점(bullet) 제거[cite: 3] */
            padding: 0;
            margin: 0;
            width: 150px; /* 메뉴의 너비 지정 */
        }
        
        li a {
            display: block; /* 텍스트뿐만 아니라 박스 전체가 클릭되도록 블록 요소로 변경[cite: 3] */
            background-color: #9c8a70; /* 기본 배경색 (베이지/브라운 계열) */
            color: white; /* 글자색 */
            padding: 10px 15px; /* 안쪽 여백 */
            text-decoration: none; /* 링크의 밑줄 제거 */
            border-bottom: 1px solid #ffffff; /* 메뉴 항목 사이의 구분선 */
        }
        
        /* 메뉴 항목에 마우스를 올린 상태(hover)일 때의 스타일[cite: 3] */
        li a:hover {
            background-color: #6b5c47; /* 더 진한 색으로 변경[cite: 3] */
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Espresso</a></li>
        <li><a href="#">Cappuccino</a></li>
        <li><a href="#">Cafe Latte</a></li>
        <li><a href="#">F.A.Q</a></li>
    </ul>
</body>
</html>
