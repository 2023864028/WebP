<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설문지</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #fce4ec; /* 연한 핑크색 배경 */
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            border: 1px solid #ccc;
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            background-color: #cddc39; /* 연두색 헤더 */
            padding: 15px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .content {
            padding: 20px;
            background-color: #f8bbd0; /* 폼 영역 배경색 */
        }
        .form-group {
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 80px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>설문지</h1>
            <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        </div>
        
        <div class="content">
            <form>
                <div class="form-group">
                    <label>학년</label>
                    <input type="radio" name="grade" value="1" checked> 1학년
                    <input type="radio" name="grade" value="2"> 2학년
                    <input type="radio" name="grade" value="3"> 3학년
                </div>

                <div class="form-group">
                    <label>성별</label>
                    <input type="radio" name="gender" value="male"> 남
                    <input type="radio" name="gender" value="female"> 여
                </div>

                <div class="form-group">
                    <label>관심 분야</label>
                    <select name="interest">
                        <option value="mobile">모바일 소프트웨어</option>
                        <option value="web">웹 프로그래밍</option>
                        <option value="ai">인공지능</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>진로</label>
                    <input type="radio" name="career" value="dev" checked> 개발
                    <input type="radio" name="career" value="plan"> 기획
                    <input type="radio" name="career" value="sales"> 영업
                    <input type="radio" name="career" value="startup"> 창업
                </div>

                <div class="form-group">
                    <label>남기고 싶은 말</label><br>
                    <textarea name="comments" placeholder="글을 남겨주세요"></textarea>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
