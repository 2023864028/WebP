<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>do-while과 break</title>
</head>
<body>
    <h3>암호를 입력하라!</h3>
    <hr>
    <script>
        let password;
        
        // 'you'가 입력될 때까지 무한 반복
        do {
            password = prompt("암호를 대라", "");
        } while (password !== "you");
        
        document.write("통과!");
    </script>
</body>
</html>
