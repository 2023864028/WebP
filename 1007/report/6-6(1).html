<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>1</title>
</head>
<body>
    <script>
        // (1) big 함수를 작성하라.
        function big(a, b) {
            let numA = parseInt(a);
            let numB = parseInt(b);
            if (numA > numB) {
                return numA;
            } else {
                return numB;
            }
        }
    </script>
    <script>
        let b = big("625", "555");
        document.write("큰수=" + b);
    </script>
</body>
</html>
