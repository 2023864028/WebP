<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2</title>
</head>
<body>
    <script>
        // (2) pr 함수를 작성하라.
        function pr(char, count) {
            for (let i = 0; i < count; i++) {
                document.write(char);
            }
        }
    </script>
    <script>
        pr("%", 5);
    </script>
</body>
