<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>큰 자리수와 낮은자리수 같은지 비교</title>
</head>
<body>
    <h3>큰 자리수와 낮은자리수 같은지 비교</h3>
    <hr>
    <script>
        let input = prompt("숫자 입력", "");
        let num = parseInt(input); // 입력값을 숫자로 변환

        if (!isNaN(num) && num > 0) {
            // 1. 제일 낮은 자리 수 구하기 (10으로 나눈 나머지)
            let lastDigit = num % 10;

            // 2. 제일 큰 자리 수 구하기 (while문 사용)
            let firstDigit = num;
            while (firstDigit >= 10) {
                // 10으로 계속 나누면서 소수점 이하를 버림
                firstDigit = Math.floor(firstDigit / 10);
            }

            // 3. 비교 및 출력
            if (firstDigit === lastDigit) {
                document.write(input + ": 같음");
            } else {
                document.write(input + ": 다름");
            }
        } else {
            document.write("올바른 양의 정수를 입력하세요.");
        }
    </script>
</body>
</html>
