<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>별 문자 출력하기</title>
    <script>
        // 별 문자를 출력하는 함수
        function printStar(n) {
            // 입력받은 문자열을 정수로 변환
            let num = parseInt(n);

            // 정수로 변환할 수 없거나(NaN), 양의 정수가 아닌 경우 (0 이하)
            if (isNaN(num) || num <= 0) {
                document.write("입력 오류 입니다.");
                return;
            }

            // 양의 정수가 정상적으로 입력된 경우 별 출력
            for (let i = 1; i <= num; i++) {
                for (let j = 0; j < i; j++) {
                    document.write("*");
                }
                document.write("<br>");
            }
        }
    </script>
</head>
<body>
    <h3>별 문자 출력하기</h3>
    <hr>
    <script>
        // 사용자로부터 입력을 받음
        let input = prompt("정수를 입력하세요", "7");
        
        // 함수 호출
        printStar(input);
    </script>
</body>
</html>
