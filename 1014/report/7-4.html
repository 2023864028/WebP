<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>방문 요일에 따라 변하는 배경색</title>
</head>
<body>
<h3>일요일은 pink, 다른 요일은 gold 배경</h3>
<hr>
<script>
    let current = new Date(); // 현재 날짜 객체 생성
    let date = current.getDate(); // 오늘 며칠인지 가져오기
    let day = current.getDay();   // 요일 가져오기 (0:일요일, 1:월요일, ... 6:토요일)
    
    // getDay() 반환값에 맞추어 출력할 요일 문자열 배열 선언
    let days = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

    if(day == 0) { 
        // 0이면 일요일
        document.body.style.backgroundColor = "pink";
    } else { 
        // 1~6이면 다른 요일
        document.body.style.backgroundColor = "gold";
    }

    // days 배열의 인덱스로 현재 요일 문자열을 가져와 출력
    document.write("오늘 : " + date + "일," + days[day]);
</script>
</body>
</html>
