<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>문자열 분할</title>
</head>
<body>
<h3>문자열 분할</h3>
<hr>
<script>
    // 사용자로부터 문자열 입력받기
    let text = prompt("문자열 입력");
    
    // 취소 버튼을 누르지 않고 값이 입력된 경우 처리
    if(text != null) { 
        // split() 메서드를 사용하여 "&"를 기준으로 분할하고 배열로 반환
        let textArray = text.split("&"); 
        
        // 분할된 문자열 배열을 순회하며 출력
        for(let i=0; i<textArray.length; i++) {
            document.write(textArray[i] + "<br>");
        }
    }
</script>
</body>
</html>
