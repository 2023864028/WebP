<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Math.random()으로 랜덤한 색 만들기</title>
<style>
    /* 힌트로 주어진 CSS 적용 */
    div { 
        display: inline-block; 
        width: 150px; 
        padding: 10px; 
    }
</style>
</head>
<body>
<h3>16개의 랜덤한 색 만들기</h3>
<hr>
<script>
    for(let i=0; i<16; i++) {
        // 0부터 255 사이의 난수 생성 (Math.random()은 0 이상 1 미만의 난수 반환)
        let r = Math.floor(Math.random() * 256); 
        let g = Math.floor(Math.random() * 256);
        let b = Math.floor(Math.random() * 256);
        
        // rgb(r,g,b) 형태의 문자열 생성
        let rgbString = "rgb(" + r + "," + g + "," + b + ")";
        
        // 생성된 랜덤 색상 문자열을 배경색과 내용으로 출력
        document.write("<div style='background-color:" + rgbString + "'>" + rgbString + "</div>");
    }
</script>
</body>
</html>
