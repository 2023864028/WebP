<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>book 객체 만들기</title>
</head>
<body>
<h3>book 객체 만들기</h3>
<hr>
<script>
    // 리터럴 표기법을 이용한 객체 생성
    let book = {
        title: "HTML5",
        author: "황기태",
        price: 20000
    };

    // 객체 출력
    document.write("book : " + book.title + ", " + book.author + ", " + book.price);
</script>
</body>
</html>
