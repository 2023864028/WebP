<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>book 객체 만들기</title>
</head>
<body>
<h3>book 객체 만들기</h3>
<hr>
<script>
    // new Object()를 이용한 객체 생성
    let book = new Object();
    book.title = "HTML5";
    book.author = "황기태";
    book.price = 20000;

    // 객체 출력
    document.write("book : " + book.title + ", " + book.author + ", " + book.price);
</script>
</body>
</html>
