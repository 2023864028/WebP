<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>배열로 리스트 만들기</title>
</head>
<body>
    <h3>라면을 만드는데 필요한 재료</h3>
    <hr>
    <script>
        let itemlist = ["라면", "계란", "물", "파"];
        
        document.write("<ul>"); // 순서 없는 리스트 시작
        
        // 배열의 길이만큼 반복하며 각 요소를 리스트 아이템으로 출력
        for (let i = 0; i < itemlist.length; i++) {
            document.write("<li>" + itemlist[i] + "</li>");
        }
        
        document.write("</ul>"); // 순서 없는 리스트 종료
    </script>
</body>
</html>
