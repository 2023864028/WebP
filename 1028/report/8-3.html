<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>visibility 프로퍼티</title>
    <style>
        /* 초기 상태에서 숨길 단어들을 보이지 않게 설정 */
        span {
            visibility: hidden;
        }
    </style>
    <script>
        function toggleVisibility() {
            // 문서 내의 모든 <span> 태그를 배열로 가져옴
            let spans = document.getElementsByTagName("span");
            
            for(let i = 0; i < spans.length; i++) {
                // 현재 visibility 상태를 확인하여 토글(toggle) 처리
                if(spans[i].style.visibility === "visible") {
                    spans[i].style.visibility = "hidden";
                } else {
                    spans[i].style.visibility = "visible";
                }
            }
        }
    </script>
</head>
<body>
    <h3>다음 빈 곳에 숨은 단어? <button onclick="toggleVisibility()">show/hide</button></h3>
    <hr>
    <ul>
        <li>I (<span>love</span>) you.</li>
        <li>CSS is Cascading (<span>Style</span>) Sheet.</li>
        <li>응답하라 (<span>1988</span>).</li>
    </ul>
</body>
</html>
