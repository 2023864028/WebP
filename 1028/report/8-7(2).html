<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>클릭할 때마다 90도 회전</title>
    <script>
        let angle = 0; // 누적될 각도를 저장하는 변수
        function rotateImage(obj) {
            angle += 90; // 클릭할 때마다 90도 증가
            obj.style.transform = "rotate(" + angle + "deg)";
        }
    </script>
</head>
<body>
    <h3>클릭하면 90도 회전합니다.</h3>
    <hr>
    <img src="spongebob.png" alt="스폰지밥" onclick="rotateImage(this)">
</body>
</html>
