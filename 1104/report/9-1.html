<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>포커스와 onblur, onfocus</title>
<script>
    // 브라우저가 포커스를 잃었을 때 (바깥을 클릭했을 때)
    window.onblur = function() {
        document.body.style.backgroundColor = "lightgray";
    };
    
    // 브라우저가 다시 포커스를 얻었을 때 (창 내부를 클릭했을 때)
    window.onfocus = function() {
        document.body.style.backgroundColor = "white";
    };
</script>
</head>
<body>
    <h3>포커스와 onblur, onfocus</h3>
    <hr>
    <p>브라우저 바깥에 마우스를 클릭하면 window 객체에 blur 이벤트가 발생하고 다시 마우스를 클릭하면 window 객체에 focus 이벤트가 발생한다.</p>
</body>
</html>
