<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>라디오 버튼과 이미지 출력</title>
<script>
    // 선택된 라디오 버튼의 value 값을 읽어와서 이미지의 src를 변경하는 함수
    function changeImage(radioObj) {
        let img = document.getElementById("fruitImage");
        img.src = radioObj.value;
    }
</script>
</head>
<body>
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
    <hr>
    <form>
        <!-- 각 라디오 버튼 클릭 시 changeImage 함수에 자기 자신(this)을 전달 -->
        <label><input type="radio" name="fruit" value="banana.png" onclick="changeImage(this)">바나나</label>
        <label><input type="radio" name="fruit" value="mango.png" onclick="changeImage(this)">망고</label>
        <label><input type="radio" name="fruit" value="apple.png" onclick="changeImage(this)" checked>사과</label>
    </form>
    
    <br>
    <!-- 초기 이미지는 사과로 설정 -->
    <img id="fruitImage" src="apple.png" alt="과일 이미지">
</body>
</html>
