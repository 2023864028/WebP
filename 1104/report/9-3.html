<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>계산기 만들기</title>
<script>
    function calculate(e) {
        // 입력된 키가 Enter 키인지 확인
        if (e.key === "Enter") {
            let exp = document.getElementById("exp").value;
            // eval() 함수를 사용하여 문자열로 된 수식을 계산
            let result = eval(exp); 
            document.getElementById("result").value = result;
        }
    }
</script>
</head>
<body>
    <h3>계산기 만들기</h3>
    <hr>
    <p>수식을 입력하고 &lt;Enter&gt;를 입력하세요.</p>
    <form>
        식 <input type="text" id="exp" onkeydown="calculate(event)"><br>
        값 <input type="text" id="result" readonly>
    </form>
</body>
</html>
