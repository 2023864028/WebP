<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이미지 커서 만들기</title>
<style>
    #cursorDiv {
        position: absolute; /* 절대 위치 지정 */
        width: 30px;
        height: 30px;
        pointer-events: none; /* 이미지가 마우스 이벤트를 방해하지 않도록 설정 */
    }
    #cursorDiv img {
        width: 100%;
        height: 100%;
    }
</style>
<script>
    // 문서 전체에 마우스 이동 이벤트 리스너 등록
    document.onmousemove = function(e) {
        let div = document.getElementById("cursorDiv");
        // 마우스의 X, Y 좌표를 div의 위치로 설정
        div.style.left = e.clientX + "px";
        div.style.top = e.clientY + "px";
    };
</script>
</head>
<body>
    <h3>이미지 커서 만들기</h3>
    <hr>
    <p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다</p>
    
    <!-- 사용할 이미지 파일명을 src에 알맞게 지정해주세요 (예: spongebob.png) -->
    <div id="cursorDiv"><img src="spongebob.png" alt="커서 이미지"></div>
</body>
</html>
