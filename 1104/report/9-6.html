<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>마우스 휠을 이용한 이미지 확대/축소</title>
<script>
    function zoomImage(e) {
        let img = e.target;
        // 휠의 이동 방향 판별 (deltaY가 양수면 아래로 굴림, 음수면 위로 굴림)
        if (e.deltaY < 0 || e.wheelDelta > 0) { 
            // 위로 굴림: 5% 축소 (현재 크기의 95%)
            img.width = img.width * 0.95;
            img.height = img.height * 0.95;
        } else { 
            // 아래로 굴림: 5% 확대 (현재 크기의 105%)
            img.width = img.width * 1.05;
            img.height = img.height * 1.05;
        }
        
        // 휠 조작 시 브라우저 페이지 전체가 스크롤되는 기본 동작 방지
        e.preventDefault();
    }
</script>
</head>
<body>
    <h3>마우스 휠을 이용한 이미지 확대/축소</h3>
    <hr>
    <p>이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.</p>
    
    <!-- onwheel 이벤트 리스너를 이미지에 직접 연결 (초기 크기를 width, height 속성으로 지정) -->
    <img src="flower.png" alt="이미지" width="280" height="210" onwheel="zoomImage(event)">
</body>
</html>
