<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이벤트 객체의 target</title>
<script>
window.onmouseover = function(e) {
    // 힌트: 이벤트 발생 객체의 tagName이 "SPAN"인지 검사
    if (e.target.tagName === "SPAN") {
        // 밑줄 긋기
        e.target.style.textDecoration = "underline";
    }
}

window.onmouseout = function(e) {
    if (e.target.tagName === "SPAN") {
        // 밑줄 지우기
        e.target.style.textDecoration = "none";
    }
}
</script>
</head>
<body>
    <h3>span 태그에만 onmouseover/onmouseout</h3>
    <hr>
    <p><span>span</span> 태그에 대해서만 <span>마우스</span>가 올라올 때 밑줄이 그어지고 <span>마우스</span>가 내려갈 때 밑줄이 사라지도록 <span>자바스크립트 코드</span>를 작성한다.</p>
</body>
</html>
