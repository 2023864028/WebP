<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML5</title>
    <script>
        // 새 윈도우를 열고 내용을 작성하는 함수
        function loadWelcomeWindow() {
            // width=200, height=80 크기의 빈 창을 엽니다.
            let win = window.open("", "", "width=200, height=80");
            
            // 새로 열린 창의 문서에 문자열을 출력합니다.
            win.document.write("접속 감사합니다!");
            
            // 문서 쓰기를 완료합니다.
            win.document.close(); 
        }
    </script>
</head>
<!-- body 태그에 onload 리스너를 등록하여 페이지가 로드될 때 함수를 실행합니다 -->
<body onload="loadWelcomeWindow()">
    <h3>HTML5</h3>
    <hr>
    <p>
    HTML5를 학습하는 사이트입니다.<br>
    여기서 HTML5, CSS3, 자바스크립트를<br>
    배울 수 있습니다.
    </p>
</body>
</html>
