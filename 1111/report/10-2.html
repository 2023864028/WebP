<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HTML5</title>
    <script>
        function loadWelcomeWindow() {
            // (1) left=500, top=400 옵션을 추가하여 지정된 스크린 위치에 팝업을 띄웁니다.
            let win = window.open("", "", "width=200, height=80, left=500, top=400");
            
            // 힌트에 따라 write()가 먼저 실행되어야 합니다.
            win.document.write("접속 감사합니다!<br>열심히 하세요!");
            
            // (2) 타이틀을 '환영'으로, 바탕색을 'yellowgreen'으로 변경합니다.
            win.document.title = "환영";
            win.document.body.style.backgroundColor = "yellowgreen";
            
            win.document.close();
        }
    </script>
</head>
<body onload="loadWelcomeWindow()">
    <h3>HTML5</h3>
    <hr>
    <p>
    HTML5를 학습하는 사이트입니다.<br>
    여기서 HTML5, CSS3, 자바스크립트를<br>
    배울 수 있습니다.
    </p>
</body>
</html>
