<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>옵션 선택으로 사이트 접속</title>
    <script>
        function loadSiteShared() {
            let select = document.getElementById("site");
            let url = select.options[select.selectedIndex].value;
            
            if (url !== "") {
                // 두 번째 매개변수에 임의의 창 이름("sharedWindow")을 부여합니다.
                // 같은 이름을 공유하므로 새 창이 하나만 열리고 그 안에서 사이트가 바뀝니다.
                window.open(url, "sharedWindow");
            }
        }
    </script>
</head>
<body>
    <h3>옵션 선택으로 사이트 접속</h3>
    <hr>
    <p>옵션 선택시 이 윈도우를 공유하여 접속합니다.</p>
    <hr>
    접속할 사이트
    <select id="site" onchange="loadSiteShared()">
        <option value="">네이버</option>
        <option value="https://www.naver.com">네이버</option>
        <option value="https://www.google.co.kr">구글</option>
        <option value="https://www.oracle.com">오라클</option>
    </select>
</body>
</html>
