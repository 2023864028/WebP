<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>div 태그에 시계 만들기</title>
    <style>
        div {
            display: inline-block;
            border: 1px solid gray;
            padding: 5px;
            background-color: lightyellow;
            cursor: pointer; /* 클릭 가능한 요소임을 나타냄 */
        }
    </style>
    <script>
        let timerId = null;
        let isRunning = false; // 시계가 동작 중인지 확인하는 상태 변수

        function updateClock() {
            let clock = document.getElementById("clock");
            let now = new Date();
            clock.innerHTML = now.toLocaleTimeString();
        }

        function toggleClock() {
            if (isRunning) {
                // 시계가 동작 중이면 중지
                clearInterval(timerId);
                isRunning = false;
                document.getElementById("clock").style.color = "gray"; // 정지 상태 표시 (선택사항)
            } else {
                // 시계가 멈춰있으면 다시 시작
                updateClock(); // 클릭 즉시 시간 갱신
                timerId = setInterval(updateClock, 1000);
                isRunning = true;
                document.getElementById("clock").style.color = "black";
            }
        }

        function init() {
            // 페이지 로드 시 바로 시계 작동
            updateClock();
            timerId = setInterval(updateClock, 1000);
            isRunning = true;
        }
    </script>
</head>
<body onload="init()">
    <h3>div 태그에 시계 만들기</h3>
    <hr>
    <p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
    <!-- 클릭 이벤트 리스너(onclick) 등록 -->
    <div id="clock" onclick="toggleClock()"></div>
</body>
</html>
