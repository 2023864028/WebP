<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>산수 문제를 풀어 봅시다</title>
    <style>
        .question {
            display: inline-block;
            width: 80px;
        }
        .answer {
            width: 60px;
        }
    </style>
    <script>
        // 랜덤으로 문제를 생성하는 함수
        function generateProblems() {
            let qArray = document.getElementsByClassName("question");
            let aArray = document.getElementsByClassName("answer");
            let operators = ["+", "-", "*", "/"];

            for (let i = 0; i < qArray.length; i++) {
                // 1~20 사이의 난수 두 개 생성
                let num1 = Math.floor(Math.random() * 20) + 1;
                let num2 = Math.floor(Math.random() * 20) + 1;
                // 4가지 연산자 중 하나를 랜덤으로 선택
                let opIndex = Math.floor(Math.random() * 4);
                let op = operators[opIndex];

                // 문제 텍스트 적용 및 초기화
                qArray[i].innerHTML = num1 + op + num2;
                qArray[i].style.textDecoration = "none";
                aArray[i].value = ""; // 입력된 답안 지우기
            }
            document.getElementById("score").innerHTML = "0"; // 점수 초기화
        }

        // 채점하는 함수
        function grade() {
            let count = 0;
            let qArray = document.getElementsByClassName("question");
            let aArray = document.getElementsByClassName("answer");

            for (let i = 0; i < qArray.length; i++) {
                let questionText = qArray[i].innerHTML;
                // 나누기의 경우 소수점이 나올 수 있으므로 Math.floor()로 내림하여 정수로 만듦
                let correctAnswer = Math.floor(eval(questionText)); 
                let userAnswer = parseInt(aArray[i].value);

                if (userAnswer === correctAnswer) {
                    count++;
                    qArray[i].style.textDecoration = "none";
                } else {
                    qArray[i].style.textDecoration = "line-through";
                }
            }
            document.getElementById("score").innerHTML = count;
        }
    </script>
</head>
<!-- 페이지 로딩이 완료되면 즉시 랜덤 문제를 만듭니다 -->
<body onload="generateProblems()">
    <h3>산수 문제를 풀어 봅시다.</h3>
    <p>자동으로 문제가 만들어집니다. 답 입력 후 채점 버튼을 누르세요. 다시 버튼을 누르면 새로운 문제가 출력됩니다. 나누기 결과는 정수입니다.</p>
    <hr>
    <div><span class="question"></span> <input type="text" class="answer"></div>
    <div><span class="question"></span> <input type="text" class="answer"></div>
    <div><span class="question"></span> <input type="text" class="answer"></div>
    <div><span class="question"></span> <input type="text" class="answer"></div>
    <br>
    <button type="button" onclick="grade()">채점</button>
    <span id="score">0</span>
    <button type="button" onclick="generateProblems()">다시</button>
</body>
</html>
