<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>screen 객체 활용</title>
    <script>
        function checkResolution() {
            // 브라우저가 아닌 사용자의 모니터 스크린 전체 해상도를 기준으로 합니다.
            let screenWidth = screen.width;
            let screenHeight = screen.height;
            
            // 너비가 1280 미만이거나 높이가 1024 미만인 경우 경고창 출력
            if (screenWidth < 1280 || screenHeight < 1024) {
                alert("스크린 해상도가 낮습니다!");
            }
        }
    </script>
</head>
<!-- 페이지가 로드되자마자 해상도 체크 함수를 실행합니다 -->
<body onload="checkResolution()">
    <h3>screen 객체 활용</h3>
    <hr>
    <p>스크린의 해상도가 1280x1024 보다<br>
    작은 경우 웹 페이지가 정상적으로<br>
    출력되지 않을 수 있음을 알리는<br>
    경고창을 출력한다.</p>
</body>
</html>
